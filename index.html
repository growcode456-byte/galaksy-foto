<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaksi Hati</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020106;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pesan {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: 90%;
      color: #ffd5f5;
      text-align: center;
      font-size: clamp(14px, 3.5vw, 22px);
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff28c8, 0 0 25px #ff28c8;
      animation: kedip 2s infinite alternate;
      pointer-events: none;
    }

    @keyframes kedip {
      from { opacity: .65; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="galaksi"></canvas>
  <div class="pesan">SELAMANYA BERSAMAMU ✦</div>

  <script>
    const canvas = document.getElementById("galaksi");
    const ctx = canvas.getContext("2d");

    let lebar, tinggi, dpr;
    let partikelLantai = [];
    let partikelHati = [];
    let bintang = [];

    function acak(min, max) {
      return Math.random() * (max - min) + min;
    }

    function aturUkuran() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      lebar = window.innerWidth;
      tinggi = window.innerHeight;

      canvas.width = lebar * dpr;
      canvas.height = tinggi * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      buatPartikel();
    }

    function buatPartikel() {
      partikelLantai = [];
      partikelHati = [];
      bintang = [];

      // Partikel galaksi di bagian bawah layar
      for (let i = 0; i < 1500; i++) {
        partikelLantai.push({
          x: acak(-1, 1),
          z: Math.random(),
          ukuran: acak(0.7, 2.4),
          warna: Math.random() > 0.5 ? "#ff5bd7" : "#ffb2ea",
          fase: acak(0, Math.PI * 2)
        });
      }

      // Bintang kecil di langit
      for (let i = 0; i < 100; i++) {
        bintang.push({
          x: Math.random() * lebar,
          y: Math.random() * tinggi * 0.72,
          ukuran: acak(0.5, 1.8),
          kedip: acak(0, Math.PI * 2)
        });
      }

      // Membuat titik-titik di dalam bentuk hati
      for (let i = 0; i < 950; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());

        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);

        partikelHati.push({
          x: hx * r,
          y: hy * r,
          ukuran: acak(0.7, 2.3),
          fase: acak(0, Math.PI * 2),
          warna: Math.random() > 0.3 ? "#ff20cf" : "#ffb5f2"
        });
      }
    }

    function gambarLatar(waktu) {
      const gradasi = ctx.createLinearGradient(0, 0, 0, tinggi);
      gradasi.addColorStop(0, "#020106");
      gradasi.addColorStop(0.68, "#08020d");
      gradasi.addColorStop(1, "#160313");

      ctx.fillStyle = gradasi;
      ctx.fillRect(0, 0, lebar, tinggi);

      // Bintang
      for (const b of bintang) {
        const terang = 0.3 + (Math.sin(waktu * 0.001 + b.kedip) + 1) * 0.35;
        ctx.globalAlpha = terang;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.ukuran, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function gambarLantai(waktu) {
      const horizon = tinggi * 0.72;

      // Cahaya galaksi di garis horizon
      const cahaya = ctx.createRadialGradient(
        lebar / 2, horizon, 5,
        lebar / 2, horizon, lebar * 0.65
      );
      cahaya.addColorStop(0, "rgba(255, 80, 220, 0.35)");
      cahaya.addColorStop(0.45, "rgba(255, 40, 180, 0.12)");
      cahaya.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = cahaya;
      ctx.fillRect(0, horizon - 100, lebar, tinggi - horizon + 100);

      // Partikel perspektif
      for (const p of partikelLantai) {
        const z = (p.z + (waktu * 0.00008) % 1) % 1;
        const kedalaman = z * z;

        const x = lebar / 2 + p.x * lebar * kedalaman * 0.78;
        const y = horizon + kedalaman * tinggi * 0.38;
        const ukuran = p.ukuran * (0.3 + kedalaman * 1.8);
        const kedip = 0.55 + Math.sin(waktu * 0.003 + p.fase) * 0.35;

        ctx.globalAlpha = kedip;
        ctx.fillStyle = p.warna;
        ctx.shadowColor = p.warna;
        ctx.shadowBlur = 8;
        ctx.fillRect(x, y, ukuran, ukuran);
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function gambarLubangHitam(waktu) {
      const x = lebar / 2;
      const y = tinggi * 0.78;
      const rx = Math.min(lebar * 0.23, 125);
      const ry = rx * 0.22;

      // Cincin bercahaya
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.04);

      ctx.shadowColor = "#ffe45c";
      ctx.shadowBlur = 24;
      ctx.strokeStyle = "#fff08a";
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#ffb52e";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * 0.78, ry * 0.72, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Pusat hitam
      const pulse = Math.sin(waktu * 0.002) * 2;
      ctx.fillStyle = "#020106";
      ctx.beginPath();
      ctx.ellipse(0, -10, rx * 0.38 + pulse, ry * 1.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gambarHati(waktu) {
      const skala = Math.min(lebar / 42, tinggi / 55) * 0.72;
      const detak = 1 + Math.sin(waktu * 0.003) * 0.035;
      const pusatX = lebar / 2;
      const pusatY = tinggi * 0.60;

      ctx.save();
      ctx.translate(pusatX, pusatY);
      ctx.scale(skala * detak, -skala * detak);

      for (const p of partikelHati) {
        const kilau = 0.5 + (Math.sin(waktu * 0.004 + p.fase) + 1) * 0.25;

        ctx.globalAlpha = kilau;
        ctx.fillStyle = p.warna;
        ctx.shadowColor = "#ff18d0";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.ukuran, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function gambar(waktu) {
      gambarLatar(waktu);
      gambarLantai(waktu);
      gambarLubangHitam(waktu);
      gambarHati(waktu);
      requestAnimationFrame(gambar);
    }

    window.addEventListener("resize", aturUkuran);

    aturUkuran();
    requestAnimationFrame(gambar);
  </script>
</body>
</html>
