
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy of Memories ✦</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #03020b;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.title {
  position: fixed;
  z-index: 2;
  top: 7%;
  width: 100%;
  text-align: center;
  pointer-events: none;
}

.title h1 {
  font-size: clamp(28px, 6vw, 58px);
  letter-spacing: 7px;
  background: linear-gradient(
    90deg, #9d9aff, #fff, #e5a7ff
  );
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  filter: drop-shadow(0 0 18px #a38cff88);
}

.title p {
  margin-top: 12px;
  color: #b7aedb;
  letter-spacing: 3px;
  font-size: 10px;
}

#universe {
  position: fixed;
  inset: 0;
  z-index: 1;
  perspective: 900px;
  overflow: hidden;
}

.photo {
  position: absolute;
  width: 82px;
  height: 108px;
  padding: 4px;
  border: 1px solid #d9c8ff99;
  border-radius: 8px;
  background: linear-gradient(145deg, #f4eaff, #7f69bb);
  box-shadow:
    0 0 12px #a78bfa55,
    0 0 28px #7654ff33;
  object-fit: cover;
  will-change: transform;
  user-select: none;
  -webkit-user-drag: none;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 4px;
  display: block;
}

.center-glow {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: #b59aff;
  filter: blur(45px);
  opacity: .8;
  pointer-events: none;
}

.center-core {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: white;
  box-shadow:
    0 0 15px 5px #d3b7ff,
    0 0 45px 15px #875bff,
    0 0 100px 35px #562bba66;
  pointer-events: none;
}

.bottom {
  position: fixed;
  z-index: 4;
  bottom: 6%;
  width: 100%;
  text-align: center;
}

.bottom p {
  color: #bcb2dc;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 17px;
}

button {
  color: white;
  padding: 12px 22px;
  margin: 4px;
  border: 1px solid #c1a7ff88;
  border-radius: 30px;
  background: #8b68df22;
  backdrop-filter: blur(12px);
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 1px;
}

button:active {
  background: #a98bff66;
}

#hint {
  position: fixed;
  z-index: 5;
  bottom: 2%;
  width: 100%;
  text-align: center;
  color: #756c99;
  font-size: 9px;
}

.shooting-star {
  position: fixed;
  z-index: 0;
  width: 100px;
  height: 2px;
  background: linear-gradient(90deg, white, transparent);
  box-shadow: 0 0 8px #a9baff;
  animation: shooting 1.4s linear forwards;
  pointer-events: none;
}

@keyframes shooting {
  from {
    transform: translate(0, 0) rotate(-35deg);
    opacity: 1;
  }
  to {
    transform: translate(-280px, 180px) rotate(-35deg);
    opacity: 0;
  }
}

@media (max-width: 500px) {
  .photo {
    width: 62px;
    height: 84px;
  }

  .title {
    top: 9%;
  }

  .title h1 {
    letter-spacing: 4px;
  }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="title">
  <h1>OUR GALAXY</h1>
  <p>A MILLION STARS, A MILLION MEMORIES</p>
</div>

<div id="universe">
  <div class="center-glow"></div>
  <div class="center-core"></div>
</div>

<div class="bottom">
  <p>✦ LOST IN OUR LITTLE UNIVERSE ✦</p>
  <button id="pause">Ⅱ PAUSE</button>
  <button id="speed">✧ SPEED ×1</button>
  <button id="fullscreen">⛶ FULLSCREEN</button>
</div>

<div id="hint">Tambahkan foto kalian di folder photos</div>

<script>
const universe = document.getElementById("universe");
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let W, H, stars = [];
let paused = false;
let speed = 1;
let rotation = 0;
let lastTime = 0;

function resize() {
  W = innerWidth;
  H = innerHeight;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  stars = Array.from({length: 240}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.5 + .3,
    phase: Math.random() * Math.PI * 2
  }));
}

function drawStars(t) {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(
    W/2, H/2, 0,
    W/2, H/2, Math.max(W,H)*.7
  );

  bg.addColorStop(0, "#17102f");
  bg.addColorStop(.5, "#090719");
  bg.addColorStop(1, "#020108");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = .25 + .75 *
      Math.abs(Math.sin(t*.0015 + s.phase));

    ctx.fillStyle = `rgba(210,215,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
}

// ------------------------------------------------
// FOTO: letakkan file foto di folder photos.
// Ubah nama file di array ini sesuai foto milikmu.
// ------------------------------------------------

const photoFiles = [
  "photos/foto1.jpg",
  "photos/foto2.jpg",
  "photos/foto3.jpg",
  "photos/foto4.jpg",
  "photos/foto5.jpg",
  "photos/foto6.jpg",
  "photos/foto7.jpg",
  "photos/foto8.jpg",
  "photos/foto9.jpg",
  "photos/foto10.jpg",
  "photos/foto11.jpg",
  "photos/foto12.jpg"
];

const items = [];

photoFiles.forEach((src, i) => {
  const card = document.createElement("div");
  card.className = "photo";

  const img = document.createElement("img");
  img.src = src;
  img.alt = "Memory " + (i+1);
  img.loading = "lazy";

  img.onerror = () => {
    card.style.display = "none";
  };

  card.appendChild(img);
  universe.appendChild(card);

  const arm = i % 3;
  const r = .18 + (i / photoFiles.length) * .78;

  items.push({
    card,
    r,
    angle: arm * Math.PI * 2 / 3 + r * 5.5,
    arm,
    size: .75 + Math.random() * .35,
    phase: Math.random() * Math.PI * 2
  });
});

function animate(time) {
  requestAnimationFrame(animate);

  const dt = Math.min((time-lastTime)/1000 || 0, .05);
  lastTime = time;

  if (!paused) rotation += dt * .20 * speed;

  drawStars(time);

  const cx = W/2;
  const cy = H*.52;
  const radius = Math.min(W*.43, H*.37);

  for (const p of items) {
    const a = p.angle + rotation *
      (.25 + (1-p.r)*.75);

    const r = p.r * radius;

    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r * .57;

    // Kartu tampak lebih kecil saat jauh
    const depth = .55 + p.r * .55;
    const float = Math.sin(time*.001 + p.phase)*3;
    const size = p.size * depth;

    // Posisi dan kedalaman
    p.card.style.left = x + "px";
    p.card.style.top = (y+float) + "px";

    p.card.style.zIndex = String(
      Math.round(p.r*100)
    );

    p.card.style.transform =
      `translate(-50%,-50%) scale(${size}) ` +
      `rotate(${Math.sin(a)*9}deg)`;

    p.card.style.opacity =
      String(.65 + p.r*.35);
  }
}

resize();
addEventListener("resize", resize);
requestAnimationFrame(animate);

// Kontrol animasi
document.getElementById("pause").onclick = function() {
  paused = !paused;
  this.textContent = paused ? "▶ PLAY" : "Ⅱ PAUSE";
};

document.getElementById("speed").onclick = function() {
  speed = speed >= 3 ? .5 : speed + .5;
  this.textContent = "✧ SPEED ×" + speed;
};

document.getElementById("fullscreen").onclick = function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
};

// Bintang jatuh
setInterval(() => {
  if (paused || Math.random() > .7) return;

  const s = document.createElement("div");
  s.className = "shooting-star";
  s.style.left = Math.random()*W + "px";
  s.style.top = Math.random()*H*.6 + "px";

  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1500);
}, 1300);
</script>

</body>
</html>
